# SyntheIce category: Noisy-Level
# Deliberately denser and more broken than real data (stress test)
#
# Range conventions (match the original notebook exactly):
#   num_layers               [lo, hi)  integer, upper bound EXCLUSIVE (np.random.randint)
#   break_prob               [lo, hi]  float, drawn once per radargram
#   jitter_strength          [lo, hi]  float, drawn once per radargram
#   gap_range                [lo, hi]  float, drawn per layer (vertical spacing, px)
#   depth_range              [top, max] first layer starts in [top, top + 5]; no layer below max
#   breaks_per_layer         [lo, hi]  integer, INCLUSIVE
#   breaks_per_layer_length  [lo, hi]  integer px, INCLUSIVE
#   partial_min/partial_max  integer px trimmed from each end, INCLUSIVE (each end with p = 0.5)

bucket: noisybucket0
paper_name: Noisy-Level

params:
  depth_range:              [100, 1000]   # rows; layers occupy only this band
  num_layers:               [35, 50]      # layers attempted
  break_prob:               [0.56, 0.85]  # probability a layer is broken at all
  gap_range:                [15, 25]      # spacing between consecutive layers, px
  jitter_strength:          [9, 12]       # amplitude of the shared spline undulation
  layer_undulation_scale:   1.2           # per-layer offset = U(-1,1) * scale * jitter
  breaks_per_layer:         [4, 7]        # gaps per broken layer
  breaks_per_layer_length:  [40, 80]      # gap length, columns
  allow_partial_layers:     true          # trim layer ends
  partial_min:              150           # min columns trimmed per end
  partial_max:              700           # max columns trimmed per end
